name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Verify zero network or telemetry references
        run: |
          if grep -rnE "URLSession|import Network|NWConnection|URLRequest" Sources/; then
            echo "Error: Networking primitives are forbidden in CleanerMac Sources/"
            exit 1
          fi

      - name: Build release binary
        run: swift build -c release

      - name: Run unit and integration test suites
        run: ./scripts/run-tests.sh

      - name: Verify app bundle packaging
        run: ./scripts/package-app.sh
